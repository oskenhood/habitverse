/* ---------- global wiring ---------- */
function wire(){
  // иконки в шапке
  const put = (sel, name, size) => { const el = $(sel); if (el) el.innerHTML = icon(name, size || 16); };
  put('#icSearch', 'search', 15);
  put('#btnTheme', 'theme', 16);
  put('#btnBell', 'bell', 16);
  put('#btnMenu', 'grip', 16);

  $('#btnMenu').onclick = () => $('#sidebar').classList.toggle('open');
  $('#brandLink').onclick = e => { e.preventDefault(); go('today'); };
  $('#btnAvatar').onclick = () => go('settings');
  $('#btnBell').onclick = () => testNotify();
  $('#btnTheme').onclick = e => themePopover(e.currentTarget);
  $('#btnSearch').onclick = () => openCmdK();

  addEventListener('keydown', e => {
    const typing = /input|textarea|select/i.test(e.target.tagName);
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'k'){ e.preventDefault(); openCmdK(); return; }
    if (e.key === 'Escape'){ closeMenu(); closeCmdK(); $('#sidebar').classList.remove('open'); const qp = $('#quotePop'); if (qp) qp.hidden = true; return; }
    if (typing) return;
    if (e.key === '/'){ e.preventDefault(); openCmdK(); return; }
    if (e.key.toLowerCase() === 'n' || e.key.toLowerCase() === 'т'){ e.preventDefault(); habitModal(); return; }
    const map = { '1':'today', '2':'habits', '3':'calendar', '4':'stats', '5':'notes', '6':'team', '7':'settings' };
    if (map[e.key]) go(map[e.key]);
  });

  document.addEventListener('click', e => {
    if (menuTrigger && menuTrigger.contains(e.target)) return;          // клик по самой кнопке-триггеру
    if (!e.target.closest('.hv-acts') && !e.target.closest('.side-link') && !e.target.closest('#menuHost')) closeMenu();
  });
  addEventListener('resize', () => { if (PAGE === 'stats') renderStats(); });

  setInterval(() => { if (Math.random() < .45 && PAGE !== 'team') simFriendActivity(); }, 120000);
  setInterval(() => {
    const t = D.today();
    const left = visibleHabits().filter(h => dueOn(h, t) && !isDone(h.id, t));
    if (left.length && new Date().getHours() >= 21 && S.lastVisit !== t + '-late'){
      S.lastVisit = t + '-late'; save();
      toast(`Осталось ${left.length} на сегодня`, 'info', '⏰', 6000);
    }
  }, 5 * 60000);
}

    run:() => { go('habits'); setTimeout(() => { const el = document.querySelector(`[data-id="${h.id}"]`);
      if (el){ el.scrollIntoView({ block:'center', behavior:'smooth' }); el.style.boxShadow = '0 0 0 2px var(--acc)'; setTimeout(() => el.style.boxShadow = '', 1200); } }, 90); } }));
  S.notes.slice(0, 20).forEach(n => out.push({ group:'Заметки', icon:'note', title:n.title || 'Без названия', sub:(n.tags||[]).map(t => '#'+t).join(' '), run:() => { go('notes'); setTimeout(() => noteModal(n.id), 90); } }));
  out.push({ group:'Оформление', icon:'theme', title: S.profile.mode === 'dark' ? 'Светлая тема' : 'Тёмная тема', sub:'', run:() => setMode(S.profile.mode === 'dark' ? 'light' : 'dark') });
  THEME_LIST.forEach(([id, name, col]) => out.push({ group:'Оформление', dot:col, title:'Акцент: ' + name, sub:'', run:() => setTheme(id) }));
  out.push({ group:'Данные', icon:'download', title:'Экспорт JSON', sub:'', run:() => exportJson() });
  out.push({ group:'Данные', icon:'download', title:'Экспорт CSV', sub:'', run:() => exportCsv() });
  out.push({ group:'Данные', icon:'sliders', title:'Настройки', sub:'профиль, оформление, данные', run:() => go('settings') });
  return out;
}
function openCmdK(prefill = ''){
  const root = $('#cmdkRoot'); root.hidden = false;
  root.innerHTML = `<div class="cmdk"><div class="modal-backdrop" data-cmdk-close></div>
    <div class="cmdk-box" role="dialog" aria-modal="true" aria-label="Поиск и команды">
      <div class="cmdk-input"><span style="color:var(--text-3);display:grid;place-items:center">${icon('search', 15)}</span>
        <input id="cmdkInput" placeholder="Поиск, разделы, команды…" value="${esc(prefill)}" autocomplete="off" spellcheck="false"></div>
      <div class="cmdk-list" id="cmdkList"></div>
      <div class="cmdk-foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> навигация</span>
        <span><span class="kbd">↵</span> выбрать</span><span><span class="kbd">esc</span> закрыть</span></div>
    </div></div>`;
  const input = $('#cmdkInput', root);
  cmdkSel = 0;
  const paint = () => {
    const q = input.value.trim().toLowerCase();
    cmdkItems = cmdkSource().filter(it => !q || (it.title + ' ' + (it.sub || '') + ' ' + it.group).toLowerCase().includes(q));
    cmdkSel = Math.min(cmdkSel, Math.max(0, cmdkItems.length - 1));
    let lastGroup = null;
    $('#cmdkList', root).innerHTML = cmdkItems.length ? cmdkItems.map((it, i) => {
      const head = it.group !== lastGroup ? `<div class="cmdk-group">${esc(it.group)}</div>` : '';
      lastGroup = it.group;
      return `${head}<div class="cmdk-item ${i === cmdkSel ? 'sel' : ''}" data-i="${i}">
        <span class="ic">${it.dot ? `<i class="dot" style="background:${it.dot}"></i>` : icon(ICON_PATHS[it.icon || ''] ? it.icon : 'spark', 15)}</span>
        <span class="tx">${esc(it.title)}</span>
        ${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''}</div>`;
    }).join('') : `<div class="empty" style="padding:34px 16px"><span class="em">${icon('search', 26)}</span><p>Ничего не нашлось по запросу «${esc(input.value)}»</p></div>`;
    $$('#cmdkList .cmdk-item', root).forEach(el => {
      el.onmouseenter = () => { cmdkSel = +el.dataset.i; $$('#cmdkList .cmdk-item', root).forEach(x => x.classList.toggle('sel', +x.dataset.i === cmdkSel)); };
      el.onclick = () => run();
    });
    const sel = $('#cmdkList .cmdk-item.sel', root); if (sel) sel.scrollIntoView({ block:'nearest' });
  };
  const run = () => { const it = cmdkItems[cmdkSel]; if (!it) return; closeCmdK(); it.run(); };
  input.oninput = () => { cmdkSel = 0; paint(); };
  input.onkeydown = e => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); cmdkSel = Math.min(cmdkItems.length - 1, cmdkSel + 1); paint(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); cmdkSel = Math.max(0, cmdkSel - 1); paint(); }
    else if (e.key === 'Enter'){ e.preventDefault(); run(); }
    else if (e.key === 'Escape'){ e.preventDefault(); closeCmdK(); }
  };
  root.querySelector('[data-cmdk-close]').onclick = closeCmdK;
  paint(); input.focus();
}
function closeCmdK(){ const r = $('#cmdkRoot'); r.hidden = true; r.innerHTML = ''; }

/* ---------- boot ---------- */
function boot(){
  load();
  ensureFriends();
  applyTheme();
  wire();
  if (!S.profile.onboarded || !S.profile.name){
    const onb = $('#onboarding');
    if (onb) onb.hidden = false;
    if (typeof onboarding === 'function'){
      try { onboarding(); return; } catch(e){ S.profile.onboarded = true; save(); }
    }
  }
  $$('.page').forEach(p => p.style.display = 'none');
  go('today');
  scheduleNotifs();

  const t = D.today();
  if (S.lastVisit !== t){
    const prev = S.lastVisit;
    S.lastVisit = t; save();
    if (prev){
      const c = todayCounts();
      setTimeout(() => toast(
        c.due ? `Сегодня запланировано ${c.due}. ${c.left ? 'Осталось ' + c.left : 'Всё закрыто'}` : 'На сегодня планов нет',
        'info', '◈', 4200), 700);
    }
  }
}
document.addEventListener('DOMContentLoaded', boot);

  save, load, render, go, blank, seedDemo, D, dueOn, streakOf, bestOf, completion, rateOf,
  freezesLeft, freezesUsed, reorderHabits, weeklyStreak, weekProgress, weekStartOf,
  levelOf, addXp, newHabit, updateHabit, removeHabit, setLog, logAt, isDone,
  habitStatsSheet, reminderSheet, exportCsv, exportJson, testNotify, setTheme, ACHS, QUOTES,
  catalogSheet, PRESETS, shareSheet, drawShareCard, shareText, reactTo, REACTIONS,
  renderSettings, renderHabits, openCmdK, closeCmdK, setMode, setTheme, THEME_LIST, SECTIONS, todayCounts,
  toast, icon, ICON_PATHS, APP_VERSION
};

/* ответ на «✓ Готово» из push-уведомления (service worker) */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener?.('message', e => {
    if (e.data && e.data.type === 'quick-done') {
      const t = D.today();
      const left = visibleHabits().filter(h => dueOn(h, t) && !isDone(h.id, t));
      if (left[0]) applyStatus(left[0].id, t, 'done', null);
    }
  });
}
