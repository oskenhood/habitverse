        ${WD.map((d,i) => `<button type="button" class="chip ${(f.days||[]).includes(i)?'on':''}" data-wd="${i}">${d}</button>`).join('')}
      </div>
      <div class="row wrap" style="gap:6px;margin-top:8px">
        <button type="button" class="chip" data-preset="all">Каждый день</button>
        <button type="button" class="chip" data-preset="work">Будни</button>
        <button type="button" class="chip" data-preset="wkd">Выходные</button>
        <button type="button" class="chip" data-preset="mwf">Пн/Ср/Пт</button>
      </div>`;
    if (f.type === 'interval') return `<label class="fld" style="margin-top:8px"><span>Каждые N дней</span>
        <input class="input" type="number" min="1" max="60" id="fEvery" value="${f.every||2}"></label>`;
    if (f.type === 'monthly') return `<label class="fld" style="margin-top:8px"><span>Числа месяца (через запятую)</span>
        <input class="input" id="fMonth" value="${(f.days||[1]).join(', ')}" placeholder="1, 15, 28"></label>`;
    if (f.type === 'weekly') return `<div class="row wrap" style="gap:6px;margin-top:8px">
        ${WD.map((d,i) => `<button type="button" class="chip ${((f.day??0)%7)===i?'on':''}" data-wk="${i}">${d}</button>`).join('')}</div>`;
    return '';
  };

  const emojiUI = () => `<div class="row wrap" style="gap:6px;margin-bottom:10px">
      ${Object.keys(EMOJIS).map(c => `<button type="button" class="chip ${c===emojiCat?'on':''}" data-ecat="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>
    <div class="emoji-grid">${EMOJIS[emojiCat].map(e => `<button type="button" data-em="${e}" class="${h.emoji===e?'on':''}">${e}</button>`).join('')}</div>`;

  openModal(`
    <div class="modal-h">
      <span style="font-size:28px" id="mPrevEm">${esc(h.emoji)}</span>
      <h2>${isEdit ? 'Редактировать привычку' : 'Новая привычка'}</h2>
      <button class="btn btn-icon btn-ghost btn-sm" data-close>✕</button>
    </div>

    <div class="tabs row" style="gap:6px;margin-bottom:18px;flex-wrap:wrap">
      <button type="button" class="chip on" data-tab="main">Основное</button>
      <button type="button" class="chip" data-tab="look">Внешний вид</button>
      <button type="button" class="chip" data-tab="sched">Расписание</button>
      <button type="button" class="chip" data-tab="rem">Напоминания</button>
    </div>

    <div data-pane="main">
      <label class="fld"><span>Название *</span>
        <input class="input" id="mName" maxlength="60" placeholder="Например: Утренняя пробежка" value="${esc(h.name)}"></label>
      <label class="fld"><span>Описание / зачем</span>
        <textarea class="textarea" id="mDesc" maxlength="280" placeholder="Зачем тебе эта привычка? Как поймёшь, что получилось?">${esc(h.desc||'')}</textarea>
        <div class="hint">Описание помогает не бросить в тяжёлый день.</div></label>
      <div class="grid g2">
        <label class="fld"><span>Категория</span>
          <select class="select" id="mCat">${CATEGORIES.map(c => `<option value="${c.id}" ${h.cat===c.id?'selected':''}>${c.name}</option>`).join('')}</select></label>
        <label class="fld"><span>Сложность</span>
          <select class="select" id="mDiff">${[1,2,3,4,5].map(d => `<option value="${d}" ${h.difficulty===d?'selected':''}>${'★'.repeat(d)}${'☆'.repeat(5-d)} ${['лёгкая','обычная','заметная','тяжёлая','хардкор'][d-1]}</option>`).join('')}</select></label>
      </div>
      <div class="grid g2">
        <label class="fld"><span>Цель за день</span>
          <input class="input" type="number" min="1" max="999" id="mTarget" value="${h.target||1}"></label>
        <label class="fld"><span>Единица</span>
          <input class="input" id="mUnit" maxlength="14" placeholder="страниц, минут, стаканов" value="${esc(h.unit||'')}"></label>
      </div>
      <label class="fld"><span>Тип привычки</span>
        <div class="row wrap" style="gap:6px">
          <button type="button" class="chip ${h.neg?'':'on'}" data-neg="0">✅ Делать</button>
          <button type="button" class="chip ${h.neg?'on':''}" data-neg="1">🚫 Не делать</button>
        </div>
        <div class="hint">«Не делать» — отметка означает «сдержался». Логика стрика та же, но провал подсвечивается иначе.</div></label>
    </div>

    <div data-pane="look" hidden>
      <label class="fld"><span>Иконка</span>${emojiUI()}</label>
      <label class="fld"><span>Своя иконка (эмодзи/символ)</span>
        <input class="input" id="mEmojiCustom" maxlength="4" placeholder="🦄" value=""></label>
      <label class="fld"><span>Цвет</span>
        <div class="swatches">${COLORS.map(c => `<button type="button" class="sw ${h.color===c?'on':''}" data-col="${c}" style="background:${c}"></button>`).join('')}
        <input type="color" id="mColCustom" value="${h.color}" style="width:34px;height:34px;border:none;background:none;border-radius:11px;cursor:pointer" title="Свой цвет"></div></label>
      <div class="card" style="margin-top:6px">
        <div class="xs faint" style="margin-bottom:9px;text-transform:uppercase;letter-spacing:.08em">Предпросмотр</div>
        <div id="mPrevWrap"></div>
      </div>
    </div>

    <div data-pane="sched" hidden>
      <label class="fld"><span>Частота</span>
        <select class="select" id="mFreq">
          <option value="daily" ${h.freq?.type==='daily'?'selected':''}>Каждый день</option>
          <option value="weekdays" ${h.freq?.type==='weekdays'?'selected':''}>Выбранные дни недели</option>
          <option value="interval" ${h.freq?.type==='interval'?'selected':''}>Каждые N дней</option>
          <option value="weekly" ${h.freq?.type==='weekly'?'selected':''}>Раз в неделю</option>
          <option value="monthly" ${h.freq?.type==='monthly'?'selected':''}>Числа месяца</option>
        </select></label>
      <div id="mFreqUI">${freqUI()}</div>
      <label class="fld" style="margin-top:14px"><span>Дата старта</span>
        <input class="input" type="date" id="mStart" value="${esc(h.start||D.today())}">
        <div class="hint">Старше старта отметки не ставятся — стрик считается отсюда.</div></label>
      <label class="fld" style="margin-top:14px"><span>📅 Недельная цель (0 = выключена)</span>
        <input class="input" type="number" min="0" max="7" id="mWeekGoal" value="${h.weekGoal || 0}">
        <div class="hint">Сколько плановых дней в неделю достаточно закрыть. При включённой квоте стрик считается
        <b>неделями</b>, а пропущенные сверх квоты дни его не рвут. Пример: «бег по будням, 3 из 5».</div></label>
      <div class="row wrap" style="gap:6px;margin:-6px 0 14px">
        ${[0,1,2,3,4,5,7].map(n => `<button type="button" class="chip ${(h.weekGoal||0)===n?'on':''}" data-wg="${n}">${n === 0 ? 'выкл' : n + ' из 7'}</button>`).join('')}
      </div>
      <label class="fld" style="margin-top:14px"><span>🧊 Заморозок стрика в месяц</span>
        <input class="input" type="number" min="0" max="31" id="mFreeze" value="${h.freezes ?? 2}">
        <div class="hint">Сколько провалов (✕) в календарный месяц прощается без разрыва стрика. 0 — жёсткий режим, рекомендация — 2. День без отметки заморозкой не спасается: поставьте ✕ вручную.</div></label>
      <div class="setting-row"><div class="txt"><b>Архивирована</b><span>Скрыть из списка, но сохранить историю</span></div>
        <div class="toggle ${h.archived?'on':''}" id="mArch"></div></div>
    </div>

    <div data-pane="rem" hidden>
      <div class="setting-row"><div class="txt"><b>Напоминание</b><span>Уведомление браузера в выбранное время</span></div>
        <div class="toggle ${h.notif?'on':''}" id="mNotif"></div></div>
      <label class="fld" style="margin-top:14px"><span>Время</span>
        <input class="input" type="time" id="mTime" value="${esc(h.reminder||'')}"></label>
      <div class="setting-row"><div class="txt"><b>Только в дни расписания</b><span>Иначе — каждый день</span></div>
        <div class="toggle ${h.repeatDays!==false?'on':''}" id="mRep"></div></div>
      <div class="card" style="margin-top:14px">
        <b class="small">Как это работает</b>
        <p class="xs muted" style="margin-top:6px;line-height:1.55">Напоминания срабатывают, пока вкладка открыта (демо) или через Service Worker в PWA-версии.
        В полной версии на Supabase добавляется Web Push с VAPID-ключами — уведомления приходят даже при закрытом браузере.</p>
        <button type="button" class="btn btn-soft btn-sm" id="mTestNotif" style="margin-top:10px">🔔 Проверить разрешение</button>
      </div>
    </div>

    <div class="modal-f">
      ${isEdit ? '<button class="btn btn-danger" id="mDel">Удалить</button>' : ''}
      <div style="flex:1"></div>
      <button class="btn btn-ghost" data-close>Отмена</button>
      <button class="btn btn-primary" id="mSave">${isEdit ? 'Сохранить' : 'Создать'}</button>
    </div>`,
  { onMount(box, close){
      $('[data-close]', box).onclick = close;

      // tabs
      $$('[data-tab]', box).forEach(b => b.onclick = () => {
        $$('[data-tab]', box).forEach(x => x.classList.toggle('on', x === b));
        $$('[data-pane]', box).forEach(p => p.hidden = p.dataset.pane !== b.dataset.tab);
        sfx('click');
        if (b.dataset.tab === 'look') preview();
      });

      // emoji categories
      const bindEmoji = () => {
        $$('[data-ecat]', box).forEach(b => b.onclick = () => { emojiCat = b.dataset.ecat;
          $('.fld [data-ecat]', box); refreshEmoji(); });
        $$('[data-em]', box).forEach(b => b.onclick = () => { h.emoji = b.dataset.em; refreshEmoji(); preview(); });
      };
      const refreshEmoji = () => {
        const pane = $('[data-pane="look"]', box);
        const fld = pane.querySelector('label.fld');
        fld.innerHTML = `<span>Иконка</span>` + emojiUI();
        bindEmoji();
        $('#mPrevEm', box).textContent = h.emoji;
      };
      bindEmoji();

      $$('[data-col]', box).forEach(b => b.onclick = () => {
        h.color = b.dataset.col;
        $$('[data-col]', box).forEach(x => x.classList.toggle('on', x === b));
        preview();
      });
      $('#mColCustom', box).oninput = e => { h.color = e.target.value; $$('[data-col]', box).forEach(x=>x.classList.remove('on')); preview(); };
      $('#mEmojiCustom', box).oninput = e => { if (e.target.value.trim()){ h.emoji = e.target.value.trim().slice(0,4); $$('[data-em]', box).forEach(x=>x.classList.remove('on')); preview(); } };
      $$('[data-neg]', box).forEach(b => b.onclick = () => {
        h.neg = b.dataset.neg === '1';
        $$('[data-neg]', box).forEach(x => x.classList.toggle('on', x === b));
        preview();
      });
      $('#mName', box).oninput = e => { h.name = e.target.value; preview(); };
      $('#mDesc', box).oninput = e => { h.desc = e.target.value; preview(); };

      // schedule
      const refreshFreq = () => { $('#mFreqUI', box).innerHTML = freqUI(); bindFreq(); };
      const bindFreq = () => {
        $$('[data-wd]', box).forEach(b => b.onclick = () => {
          const i = +b.dataset.wd; const days = h.freq.days || [];
          h.freq.days = days.includes(i) ? days.filter(x => x !== i) : [...days, i].sort();
          b.classList.toggle('on');
        });
        $$('[data-wk]', box).forEach(b => b.onclick = () => {
          h.freq.day = +b.dataset.wk; $$('[data-wk]', box).forEach(x => x.classList.toggle('on', x === b));
        });
        $$('[data-preset]', box).forEach(b => b.onclick = () => {
          const p = b.dataset.preset;
          h.freq.days = p === 'all' ? [0,1,2,3,4,5,6] : p === 'work' ? [0,1,2,3,4] : p === 'wkd' ? [5,6] : [0,2,4];
          refreshFreq();
        });
        const ev = $('#fEvery', box); if (ev) ev.oninput = () => h.freq.every = clamp(+ev.value || 1, 1, 60);
        const mo = $('#fMonth', box); if (mo) mo.oninput = () => h.freq.days = mo.value.split(',').map(x => clamp(parseInt(x) || 1, 1, 31));
      };
      bindFreq();
      $('#mFreq', box).onchange = e => {
        const t = e.target.value;
        h.freq = t === 'weekdays' ? { type:t, days:[0,1,2,3,4] } : t === 'interval' ? { type:t, every:2 }
               : t === 'monthly' ? { type:t, days:[1] } : t === 'weekly' ? { type:t, day:0 } : { type:'daily' };
        refreshFreq();
      };

      // toggles
      const tg = (sel, key, init) => { const el = $(sel, box); let v = init; el.onclick = () => { v = !v; el.classList.toggle('on', v); h[key] = v; }; };
      const wgSet = n => { h.weekGoal = n; $$('[data-wg]', box).forEach(x => x.classList.toggle('on', +x.dataset.wg === n));
        const inp = $('#mWeekGoal', box); if (inp) inp.value = n; };
      $$('[data-wg]', box).forEach(b => b.onclick = () => wgSet(+b.dataset.wg));
      const wgInput = $('#mWeekGoal', box);
      if (wgInput) wgInput.oninput = () => { const n = clamp(parseInt(wgInput.value, 10) || 0, 0, 7); h.weekGoal = n;
        $$('[data-wg]', box).forEach(x => x.classList.toggle('on', +x.dataset.wg === n)); };

      tg('#mArch', 'archived', h.archived);
      tg('#mNotif', 'notif', h.notif);
      tg('#mRep', 'repeatDays', h.repeatDays !== false);

      $('#mTestNotif', box).onclick = async () => {
        if (!('Notification' in window)) return toast('Браузер не поддерживает уведомления','bad','🚫');
        const p = await Notification.requestPermission();
        toast(p === 'granted' ? 'Разрешение получено — напоминания придут' : `Статус: ${p}`, p === 'granted' ? 'ok' : 'bad', '🔔');
        if (p === 'granted') { S.profile.notif = true; save(); new Notification('HabitVerse', { body:'Напоминания работают ✨', icon:'' }); }
      };

      function preview(){
        const w = $('#mPrevWrap', box); if (!w) return;
        $('#mPrevEm', box).textContent = h.emoji;
        const tmp = { ...h, name: h.name || 'Название привычки' };
        w.innerHTML = `<div style="--hc:${h.color}" class="habit" >
          <div class="check on"><span class="tick">✓</span></div>
          <div class="habit-body">
            <div class="habit-name"><span class="em">${esc(tmp.emoji)}</span><span>${esc(tmp.name)}</span>
              ${tmp.target>1?`<span class="cnt">0/${tmp.target} ${esc(tmp.unit||'')}</span>`:''}
              ${tmp.neg?'<span class="pill bad">🚫 не делать</span>':''}</div>
            ${tmp.desc?`<div class="habit-desc">${esc(tmp.desc)}</div>`:''}
            <div class="habit-meta">
              <span class="pill" style="color:${catOf(tmp.cat).color};border-color:${catOf(tmp.cat).color}55">${icon(catOf(tmp.cat).icon || 'dash', 12)} ${catOf(tmp.cat).name}</span>
              <span class="pill">${esc(freqLabel(tmp))}</span>
              ${tmp.reminder?`<span class="pill ok">⏰ ${esc(tmp.reminder)}</span>`:''}
              <span class="pill warn">🔥 0</span>
            </div>
          </div>
          <div class="habit-side"><div class="streak"><b class="mono">0</b><span>стрик</span></div></div>
        </div>`;
      }
      preview();

      $('#mSave', box).onclick = async () => {
        h.name = $('#mName', box).value.trim();
        if (!h.name){ toast('Введи название привычки','bad','⚠️'); $('#mName', box).focus(); sfx('error'); return; }
        h.desc = $('#mDesc', box).value.trim();
        h.cat = $('#mCat', box).value;
        h.difficulty = +$('#mDiff', box).value;
        h.target = clamp(+$('#mTarget', box).value || 1, 1, 999);
        h.unit = $('#mUnit', box).value.trim();
        const fr = $('#mFreeze', box); if (fr) h.freezes = clamp(parseInt(fr.value, 10) || 0, 0, 31);
        const wg = $('#mWeekGoal', box); if (wg) h.weekGoal = clamp(parseInt(wg.value, 10) || 0, 0, 7);
        h.start = $('#mStart', box).value || D.today();
        h.reminder = $('#mTime', box).value || '';
        if (h.reminder && h.notif && Notification.permission !== 'granted'){
          try { await Notification.requestPermission(); } catch(e){}
        }
        if (isEdit){ updateHabit(id, h); toast('Изменения сохранены','ok','✅'); }
        else { newHabit(h); toast('Привычка создана','ok','🎉'); }
        close(); render();
      };
      const del = $('#mDel', box);
      if (del) del.onclick = () => confirmDialog('Удалить привычку?', `"${h.name}" и вся история будут удалены.`, () => { removeHabit(id); close(); toast('Удалено','bad','🗑️'); render(); });
    }});
}

/* ---------- статистика одной привычки ---------- */
function habitStatsSheet(id){
  const h = S.habits.find(x => x.id === id); if (!h) return;
  const s = streakOf(h);
  const days = D.daysBetween(h.start || D.add(D.today(), -89), D.today());
  const c90 = completion(h, days);
  const c30 = completion(h, D.daysBetween(D.add(D.today(), -29), D.today()));
  const c7  = completion(h, D.daysBetween(D.add(D.today(), -6), D.today()));
  const byDow = [0,1,2,3,4,5,6].map(i => {
    const ks = days.filter(k => D.dow(k) === i && dueOn(h, k));
    return { i, due: ks.length, done: ks.filter(k => isDone(h.id, k)).length };
  });
  const totalVal = Object.values(S.logs[h.id] || {}).reduce((n,l) => n + (l.val || 0), 0);

  openSheet(`
    <div class="modal-h"><span style="font-size:26px">${esc(h.emoji)}</span>
      <div style="flex:1"><h2 style="font-size:17px">${esc(h.name)}</h2><p class="small muted">${esc(freqLabel(h))} · с ${esc(D.human(h.start||D.today()))}</p></div>
      <button class="btn btn-icon btn-ghost btn-sm" data-close>✕</button></div>
    ${h.desc ? `<p class="small muted" style="margin-bottom:14px;line-height:1.55">${esc(h.desc)}</p>` : ''}
    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">
      <div class="kpi" style="--kc:${h.color}33"><div class="kpi-val mono">${s.cur}</div><div class="kpi-lab">текущий стрик</div></div>
      <div class="kpi" style="--kc:${h.color}33"><div class="kpi-val mono">${s.best}</div><div class="kpi-lab">рекорд</div></div>
      <div class="kpi" style="--kc:${h.color}33"><div class="kpi-val mono">${c30 ? Math.round(c30.rate*100) : 0}%</div><div class="kpi-lab">30 дней</div></div>
      <div class="kpi" style="--kc:${h.color}33"><div class="kpi-val mono">${c90 ? c90.done : 0}</div><div class="kpi-lab">всего отметок</div></div>
      ${h.freezes > 0 ? `<div class="kpi" style="--kc:${h.color}33"><div class="kpi-val mono">🧊 ${freezesLeft(h)}</div><div class="kpi-lab">заморозок осталось</div></div>` : ''}
    </div>
    ${h.neg ? '<span class="pill bad" style="margin-bottom:10px">🚫 привычка «не делать»: отметка = сдержался</span>' : ''}
    ${s.frozen ? `<span class="pill warn" style="margin-bottom:10px;margin-left:6px">🧊 стрик спасён заморозкой ${s.frozen} раз(а)</span>` : ''}
    <div class="divider"></div>
    <div class="row wrap" style="gap:8px;margin-bottom:8px">
      <span class="pill ${c7 && c7.rate>=.8?'ok':c7&&c7.rate<.5?'bad':''}">7 дней: ${c7?Math.round(c7.rate*100):0}%</span>
      <span class="pill ${c30 && c30.rate>=.8?'ok':c30&&c30.rate<.5?'bad':''}">30 дней: ${c30?Math.round(c30.rate*100):0}%</span>
      <span class="pill ${c90 && c90.rate>=.8?'ok':c90&&c90.rate<.5?'bad':''}">всё время: ${c90?Math.round(c90.rate*100):0}%</span>
      ${h.unit && totalVal ? `<span class="pill warn">Σ ${totalVal} ${esc(h.unit)}</span>` : ''}
    </div>
    <div class="card" style="margin-top:12px"><div class="card-h"><h3>По дням недели</h3></div>
      ${byDow.map(d => `<div class="bar-row"><div class="bar-name">${WD_FULL[d.i]}</div>
        <div class="bar-track"><div class="bar-fill" style="--bc:${h.color};width:${d.due?Math.round(d.done/d.due*100):0}%"></div></div>
        <div class="bar-val">${d.due?Math.round(d.done/d.due*100):0}%</div></div>`).join('')}
    </div>
    <div class="card" style="margin-top:12px"><div class="card-h"><h3>Последние 90 дней</h3></div>
      <div class="hm" id="hmOne"></div></div>`,
  { onMount(box, close){
      $('[data-close]', box).onclick = close;
      $('#hmOne', box).innerHTML = heatmapHTML(h, 90);
      bindHeatmap($('#hmOne', box), h);
    }});
}

function heatmapHTML(h, days){
  const t = D.today();
  const start = D.add(t, -(days - 1));
  const weeks = [];
  let k = start;
  // выровняем на понедельник
  while (D.dow(k) !== 0) k = D.add(k, -1);
  while (k <= t){
    const col = [];
    for (let i = 0; i < 7; i++){ const kk = D.add(k, i); col.push(kk > t ? null : kk); }
    weeks.push(col); k = D.add(k, 7);
  }
  const cells = weeks.map(col => `<div class="hm-col">${col.map(kk => {
    if (!kk) return `<div class="hm-cell" style="opacity:.18"></div>`;
    const d = dueOn(h, kk), l = logAt(h.id, kk);
    const st = l ? l.status : (d && kk < t ? 'miss' : null);
    const lvl = !d ? '' : st === 'done' ? 'l4' : st === 'skip' ? 'l2' : st === 'miss' ? '' : 'l1';
    return `<div class="hm-cell ${lvl}" data-k="${kk}" data-st="${st||''}" data-due="${d?1:0}"
      style="${st==='miss'?'background:color-mix(in oklab,var(--bad) 55%,transparent)':''}"
      title="${D.human(kk)}${d?'':' · не запланировано'}"></div>`;
  }).join('')}</div>`).join('');
  return `<div class="hm-inner">${cells}</div>
    <div class="hm-legend"><span>меньше</span>
      <div class="hm-cell"></div><div class="hm-cell l1"></div><div class="hm-cell l2"></div><div class="hm-cell l3"></div><div class="hm-cell l4"></div>
      <span>больше</span><span style="margin-left:10px;color:var(--bad)">■ провал</span></div>`;
}
function bindHeatmap(root, h){
  if (!root) return;
  root.onclick = e => {
    const cell = e.target.closest('.hm-cell'); if (!cell || !cell.dataset.k) return;
    if (D.isFuture(cell.dataset.k)) return toast('Будущее ещё не наступило 🙂','info','⏳');
    dayHabitSheet(h, cell.dataset.k);
  };
}

/* ============================================================
   CALENDAR
   ============================================================ */
function renderCalendar(){
  const box = $('.page[data-page="calendar"]');
  const t = D.today();
  if (!UI.calMonth) UI.calMonth = t.slice(0, 7);
  const [Y, M] = UI.calMonth.split('-').map(Number);
  const first = new Date(Y, M - 1, 1);
  const daysInMonth = new Date(Y, M, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const habits = visibleHabits();
  const sel = UI.calHabit;

  const cells = [];
  for (let i = 0; i < lead; i++){
    const k = D.add(D.key(first), i - lead);
    cells.push({ k, out:true });
  }
  for (let d = 1; d <= daysInMonth; d++){
    const k = `${Y}-${pad(M)}-${pad(d)}`;
    cells.push({ k, out:false });
  }
  while (cells.length % 7) cells.push({ k: D.add(cells[cells.length-1].k, 1), out:true });

  const monthKeys = cells.filter(c => !c.out).map(c => c.k).filter(k => k <= t);
  let mDue = 0, mDone = 0;
  monthKeys.forEach(k => habits.filter(h => sel === 'all' ? true : h.id === sel).forEach(h => {
    if (!dueOn(h, k)) return; mDue++; if (isDone(h.id, k)) mDone++;
  }));

  box.innerHTML = `
  <div class="cal-head">
    <button class="btn btn-icon btn-ghost btn-sm" id="calPrev">‹</button>
    <div class="cal-title">${D.monthName(M-1)} ${Y}</div>
    <button class="btn btn-icon btn-ghost btn-sm" id="calNext">›</button>
    <button class="btn btn-ghost btn-sm" id="calToday">Сегодня</button>
    <div style="flex:1"></div>
    <select class="select" id="calSel" style="width:auto;max-width:230px">
      <option value="all">Все привычки</option>
      ${habits.map(h => `<option value="${h.id}" ${sel===h.id?'selected':''}>${esc(h.emoji)} ${esc(h.name)}</option>`).join('')}
    </select>
    <span class="pill ${mDue&&mDone/mDue>=.8?'ok':mDue&&mDone/mDue<.5?'bad':''}">${mDue?Math.round(mDone/mDue*100):0}% за месяц</span>
  </div>

  <div class="grid g2" style="grid-template-columns:1.6fr 1fr;margin-bottom:var(--sp)">
    <div class="card">
      <div class="cal-grid" style="margin-bottom:8px">
        ${WD.map(d => `<div class="cal-dow">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">
        ${cells.map(c => {
          const list = habits.filter(h => sel === 'all' ? true : h.id === sel);
          const dueL = list.filter(h => dueOn(h, c.k));
          const doneL = dueL.filter(h => isDone(h.id, c.k));
          const missedL = dueL.filter(h => !isDone(h.id, c.k) && c.k < t);
          const rate = dueL.length ? doneL.length / dueL.length : null;
          const cls = ['cal-cell', c.out ? 'out' : '', c.k === t ? 'today' : '', D.isFuture(c.k) ? 'future' : '',
                       rate === 1 ? 'full' : '', rate === 0 && dueL.length ? 'zero' : ''].join(' ');
          const shown = sel === 'all' ? list : list;
          return `<div class="${cls}" data-day="${c.k}">
            <div class="cal-day">${D.parse(c.k).getDate()}</div>
            <div class="cal-dots">
              ${sel === 'all'
                ? doneL.slice(0,10).map(h => `<i class="d" style="--c:${h.color}" title="${esc(h.name)}"></i>`).join('') +
                  missedL.slice(0,10).map(h => `<i class="m" style="--c:${h.color}" title="${esc(h.name)} — провал"></i>`).join('')
                : (() => { const h = shown[0]; if (!h || !dueOn(h, c.k)) return ''; const l = logAt(h.id, c.k);
                    return l ? `<i class="${l.status==='done'?'d':l.status==='skip'?'s':'m'}" style="--c:${h.color}"></i>` : (c.k < t ? '<i class="m"></i>' : ''); })() }
            </div>
            ${rate !== null ? `<div class="cal-rate">${Math.round(rate*100)}%</div>` : ''}
            <div class="fillbar" style="width:${rate ? rate*100 : 0}%"></div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:var(--sp)">
      <div class="card">
        <div class="card-h"><h3>📆 День</h3><div class="sp"></div><span class="xs faint" id="calDayLabel">выбери день</span></div>
        <div id="calDay"><p class="small muted">Кликни по любому дню, чтобы отметить привычки — включая прошлые даты.</p></div>
      </div>
      <div class="card">
        <div class="card-h"><h3>🔥 Heatmap года</h3><div class="sp"></div>
          <span class="xs faint">${sel === 'all' ? 'все привычки' : esc(habits.find(h=>h.id===sel)?.name || '')}</span></div>
        <div class="hm" id="calHm"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h3>Сводка месяца</h3><div class="sp"></div>
      <span class="pill">${mDone} из ${mDue}</span></div>
    <div class="grid g4" style="margin-bottom:6px">
      ${monthStats(Y, M, habits, sel)}
    </div>
  </div>`;

  $('#calPrev').onclick = () => { const d = new Date(Y, M - 2, 1); UI.calMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); };
  $('#calNext').onclick = () => { const d = new Date(Y, M, 1); UI.calMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); };
  $('#calToday').onclick = () => { UI.calMonth = t.slice(0,7); render(); };
  $('#calSel').onchange = e => { UI.calHabit = e.target.value; render(); };

  const hmRoot = $('#calHm');
  hmRoot.innerHTML = yearHeatmapHTML(habits, sel);
  bindYearHeatmap(hmRoot, habits, sel);

  const showDay = k => {
    $('#calDayLabel').textContent = D.human(k);
    const list = habits.filter(h => sel === 'all' ? true : h.id === sel);
    const rows = list.map(h => {
      const d = dueOn(h, k), l = logAt(h.id, k);
      const st = l ? l.status : (d && k < t ? 'miss' : null);
      return `<div class="row" style="gap:10px;padding:9px 0;border-bottom:1px solid var(--stroke)">
        <button class="check ${st==='done'?'on':st==='skip'?'skip':st==='miss'?'miss':''}" style="--hc:${h.color};width:38px;height:38px;border-radius:12px;font-size:17px" data-dchk="${h.id}|${k}">
          <span class="tick">${st==='done'?'✓':st==='skip'?'⤼':st==='miss'?'✕':esc(h.emoji)}</span></button>
        <div style="flex:1;min-width:0">
          <b class="small" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.emoji)} ${esc(h.name)}</b>
          <span class="xs faint">${d ? 'запланировано' : 'не в расписании'}${st ? ' · ' + ({done:'выполнено',skip:'пропуск',miss:'провал'}[st]) : ''}</span>
        </div>
        ${D.isFuture(k) ? '<span class="pill">будущее</span>' : `<button class="icon-btn" data-dnote="${h.id}|${k}" title="Заметка ко дню">📝</button>`}
      </div>`;
    }).join('');
    $('#calDay').innerHTML = rows || '<p class="small muted">Нет привычек.</p>';
    $$('[data-dchk]', box).forEach(b => b.onclick = () => {
      const [id, key] = b.dataset.dchk.split('|');
      if (D.isFuture(key)) return toast('Отметить будущее нельзя','info','⏳');
      cycleStatus(id, key, b); showDay(key); renderCalendar();
    });
    $$('[data-dnote]', box).forEach(b => b.onclick = () => {
      const [id, key] = b.dataset.dnote.split('|');
      const h = S.habits.find(x => x.id === id); if (h) dayHabitSheet(h, key);
    });
  };
  $$('.cal-cell:not(.future)', box).forEach(c => c.onclick = () => showDay(c.dataset.day));
  showDay(t);
}

function monthStats(Y, M, habits, sel){
  const t = D.today();
  const keys = D.daysBetween(`${Y}-${pad(M)}-01`, `${Y}-${pad(M)}-${pad(new Date(Y,M,0).getDate())}`).filter(k => k <= t);
  const list = habits.filter(h => sel === 'all' ? true : h.id === sel);
  let due = 0, done = 0; const perDay = [];
  keys.forEach(k => {
    const dl = list.filter(h => dueOn(h, k)); due += dl.length;
    const dn = dl.filter(h => isDone(h.id, k)); done += dn.length;
    perDay.push(dl.length ? dn.length / dl.length : null);
  });
  const perfect = perDay.filter(v => v === 1).length;
  let bestRun = 0, run = 0;
  perDay.forEach(v => { if (v === 1) { run++; bestRun = Math.max(bestRun, run); } else run = 0; });
  const kpi = (v, l, c) => `<div class="kpi" style="--kc:${c}33;padding:14px"><div class="kpi-val mono" style="font-size:24px">${v}</div><div class="kpi-lab">${l}</div></div>`;
  return kpi(keys.length ? Math.round(done/Math.max(1,due)*100)+'%' : '—', 'выполнение', getCSS('--acc')) +
         kpi(done, 'отметок', getCSS('--ok')) +
         kpi(perfect, 'идеальных дней', getCSS('--warn')) +
         kpi(bestRun, 'дней подряд 100%', getCSS('--acc3'));
}

function yearHeatmapHTML(habits, sel){
  const t = D.today();
  const start = D.add(t, -364);
  let k = start; while (D.dow(k) !== 0) k = D.add(k, -1);
  const list = habits.filter(h => sel === 'all' ? true : h.id === sel);
  const weeks = [];
  while (k <= t){
    const col = [];
    for (let i = 0; i < 7; i++){ const kk = D.add(k, i); col.push(kk > t ? null : kk); }
    weeks.push(col); k = D.add(k, 7);
  }
  return `<div class="hm-inner">${weeks.map(col => `<div class="hm-col">${col.map(kk => {
    if (!kk) return `<div class="hm-cell" style="opacity:.15"></div>`;
    const dueL = list.filter(h => dueOn(h, kk));
    const rate = dueL.length ? dueL.filter(h => isDone(h.id, kk)).length / dueL.length : null;
    const lvl = rate === null ? '' : rate === 0 ? '' : rate < .34 ? 'l1' : rate < .67 ? 'l2' : rate < 1 ? 'l3' : 'l4';
    const style = rate === 0 && dueL.length ? 'background:color-mix(in oklab,var(--bad) 50%,transparent)' : '';
    return `<div class="hm-cell ${lvl}" data-k="${kk}" style="${style}" title="${D.human(kk)}${rate!==null?` · ${Math.round(rate*100)}%`:''}"></div>`;
  }).join('')}</div>`).join('')}</div>
  <div class="hm-legend"><span>0%</span><div class="hm-cell"></div><div class="hm-cell l1"></div><div class="hm-cell l2"></div><div class="hm-cell l3"></div><div class="hm-cell l4"></div><span>100%</span></div>`;
}
function bindYearHeatmap(root, habits, sel){
  if (!root) return;
  root.onclick = e => {
    const c = e.target.closest('.hm-cell'); if (!c || !c.dataset.k) return;
    if (D.isFuture(c.dataset.k)) return;
    if (sel !== 'all'){ const h = habits.find(x => x.id === sel); if (h) dayHabitSheet(h, c.dataset.k); return; }
    UI.calMonth = c.dataset.k.slice(0, 7); renderCalendar();
    setTimeout(() => { const cell = $(`.cal-cell[data-day="${c.dataset.k}"]`); if (cell) cell.click(); }, 30);
  };
}

/* ============================================================

function renderStats(){

  const t = D.today();
  const N = UI.statsRange;
  const keys = D.daysBetween(D.add(t, -(N-1)), t);

  const perDay = keys.map(k => {
    const dl = habits.filter(h => dueOn(h, k));
    const dn = dl.filter(h => isDone(h.id, k));
    return { k, due: dl.length, done: dn.length, rate: dl.length ? dn.length/dl.length : null };
  });
  const valid = perDay.filter(d => d.rate !== null);
  const overall = valid.length ? sum(valid.map(d => d.rate))/valid.length : 0;
  const prevKeys = D.daysBetween(D.add(t, -(2*N-1)), D.add(t, -N));
  const prevValid = prevKeys.map(k => { const dl = habits.filter(h=>dueOn(h,k)); return dl.length ? dl.filter(h=>isDone(h.id,k)).length/dl.length : null; }).filter(v=>v!==null);
  const prev = prevValid.length ? sum(prevValid)/prevValid.length : 0;

  box.innerHTML = `
  <div class="habit-toolbar">

    ${kpi('trend', curStreak, 'текущий стрик', `рекорд: ${bestStreak} дн.`, null, getCSS('--warn'))}
    ${kpi('check', totalDone, 'отметок', `${totalMissed} пропущено`, null, getCSS('--ok'))}
    ${kpi('spark', perfectDays, 'идеальных дней', `${Math.round(perfectDays/Math.max(1,keys.length)*100)}% периода`, null, getCSS('--acc3'))}
        ${kpi('target', habits.length, 'привычек', `${new Set(habits.map(h=>h.cat)).size} категорий`, null, getCSS('--acc'))}
  </div>

  <div class="grid g2" style="margin-bottom:var(--sp)">
    <div class="card chart-box">
      <div class="card-h"><h3>Динамика выполнения</h3><div class="sp"></div><span class="xs faint">${N} дней</span></div>
      <canvas id="chTrend" height="230"></canvas>
      <div class="legend">
        <span><i style="background:${getCSS('--acc')}"></i>% выполнения</span>
        <span><i style="background:${getCSS('--acc2')}"></i>скользящее среднее (7)</span>
      </div>
    </div>
    <div class="card chart-box">
      <div class="card-h"><h3>Статусы отметок</h3><div class="sp"></div></div>
      <canvas id="chDonut" height="230"></canvas>
      <div class="legend" id="donutLegend"></div>
    </div>
  </div>

  <div class="grid g2" style="margin-bottom:var(--sp)">
    <div class="card">
      <div class="card-h"><h3>Привычки: рейтинг выполнения</h3><div class="sp"></div><span class="xs faint">${N} дн.</span></div>
      <div id="bars">${habitBars(habits, N)}</div>
    </div>
    <div class="card chart-box">
      <div class="card-h"><h3>Активность по дням недели</h3></div>
      <canvas id="chDow" height="220"></canvas>
      <div class="legend"><span><i style="background:${getCSS('--ok')}"></i>выполнено</span><span><i style="background:var(--stroke2)"></i>запланировано</span></div>
    </div>

  <div class="grid g2" style="margin-bottom:var(--sp)">

      <div class="card-h"><h3>Баланс сфер жизни</h3><div class="sp"></div><span class="xs faint">радар по категориям</span></div>
      <canvas id="chRadar" height="260"></canvas>

    <div class="card">
      <div class="card-h"><h3>Стрики по привычкам</h3><div class="sp"></div><span class="xs faint">текущий / рекорд</span></div>
      <div id="streakList">${streakList(habits)}</div>

function kpi(ic, val, lab, delta, dcolor, kc){
  return `<div class="kpi" style="--kc:${kc}22">
    <div class="kpi-ic">${ICON_PATHS[ic] ? icon(ic, 15) : ic}</div>
    <div class="kpi-val mono">${val}</div>
    <div class="kpi-lab">${lab}</div>
    ${delta ? `<div class="kpi-delta" style="color:${dcolor||'var(--muted)'}">${delta}</div>` : ''}</div>`;
}
function habitBars(habits, N){
  if (!habits.length) return '<p class="small muted">Нет данных.</p>';
  const rows = habits.map(h => ({ h, r: rateOf(h, N) })).filter(x => x.r !== null).sort((a,b) => b.r - a.r);
  if (!rows.length) return '<p class="small muted">За период не было запланированных дней.</p>';
  return rows.map(x => `<div class="bar-row">
    <div class="bar-name" title="${esc(x.h.name)}">${esc(x.h.emoji)} ${esc(x.h.name)}</div>
    <div class="bar-track"><div class="bar-fill" style="--bc:${x.h.color};width:${Math.round(x.r*100)}%"></div></div>
    <div class="bar-val">${Math.round(x.r*100)}%</div></div>`).join('');
}
function streakList(habits){
  if (!habits.length) return '<p class="small muted">Нет привычек.</p>';
  return habits.map(h => ({ h, s: streakOf(h) })).sort((a,b) => b.s.cur - a.s.cur).map(x => `<div class="bar-row">
    <div class="bar-name">${esc(x.h.emoji)} ${esc(x.h.name)}</div>
    <div class="bar-track"><div class="bar-fill" style="--bc:${x.h.color};width:${clamp(x.s.cur/Math.max(1,x.s.best)*100,3,100)}%"></div></div>
    <div class="bar-val">${x.s.cur} / ${x.s.best}</div></div>`).join('');
}
function insights(habits, N, perDay){
  const out = [];
  const valid = perDay.filter(d => d.rate !== null);
  const overall = valid.length ? avg(valid.map(d => d.rate)) : 0;
  const dowBest = (() => { const arr = [0,1,2,3,4,5,6].map(i => { const ks = valid.filter(d => D.dow(d.k) === i); return { i, r: ks.length ? avg(ks.map(d=>d.rate)) : 0, n: ks.length }; });
    return arr.filter(x => x.n).sort((a,b) => b.r - a.r)[0]; })();
  const dowWorst = (() => { const arr = [0,1,2,3,4,5,6].map(i => { const ks = valid.filter(d => D.dow(d.k) === i); return { i, r: ks.length ? avg(ks.map(d=>d.rate)) : 0, n: ks.length }; });
    return arr.filter(x => x.n).sort((a,b) => a.r - b.r)[0]; })();
  const sorted = habits.map(h => ({ h, r: rateOf(h, N) })).filter(x => x.r !== null).sort((a,b) => a.r - b.r);
  const weak = sorted[0], strong = sorted[sorted.length-1];
  const longest = habits.map(h => ({ h, s: streakOf(h) })).sort((a,b) => b.s.best - a.s.best)[0];
  const cat = CATEGORIES.map(c => { const hs = habits.filter(h => h.cat === c.id); const rs = hs.map(h => rateOf(h, N)).filter(v => v !== null); return { c, n: hs.length, r: rs.length ? avg(rs) : null }; }).filter(x => x.r !== null).sort((a,b) => b.r - a.r);
  const unusedCat = CATEGORIES.find(c => !habits.some(h => h.cat === c.id));

  const card = (ic, title, text, tone='') => `<div class="card"><div class="row" style="gap:11px;align-items:flex-start">
    <span class="ins-ic">${icon(ic, 16)}</span><div><b style="font-size:14px">${title}</b>
    <p class="small muted" style="margin-top:5px;line-height:1.55">${text}</p></div></div></div>`;

  if (overall >= .85) out.push(card('award','Ты в отличной форме', `${Math.round(overall*100)}% выполнения за ${N} дней. Пора повышать планку: добавь сложность или новую привычку.`));
  else if (overall >= .5) out.push(card('trend','Хороший рабочий ритм', `${Math.round(overall*100)}% за период. До стабильных 85% не хватает совсем немного — попробуй сократить число привычек до 3–5 ключевых.`));
  else if (valid.length) out.push(card('target','Нужна перезагрузка системы', `${Math.round(overall*100)}% выполнения. Скорее всего привычек слишком много или они слишком крупные. Разбей одну на шаги по 2 минуты.`));
  else out.push(card('leaf','Данных пока мало', 'Добавь привычки и отметь пару дней — здесь появятся персональные инсайты.'));

  if (dowBest && dowWorst && dowBest.i !== dowWorst.i)
    out.push(card('cal', `${WD_FULL[dowBest.i]} — твой день`,
      `В ${WD_FULL[dowBest.i].toLowerCase()} ты выполняешь ${Math.round(dowBest.r*100)}%, а в ${WD_FULL[dowWorst.i].toLowerCase()} — всего ${Math.round(dowWorst.r*100)}%. Перенеси тяжёлые привычки на сильные дни.`));
  if (weak && weak.r < .6) out.push(card('warn','Слабое звено', `${esc(weak.h.emoji)} «${esc(weak.h.name)}» — ${Math.round(weak.r*100)}%. Уменьши цель (минимум 2 минуты) или привяжи к уже существующей привычке.`));
  if (strong && strong.r >= .8) out.push(card('heart','Опора', `${esc(strong.h.emoji)} «${esc(strong.h.name)}» — ${Math.round(strong.r*100)}%. Используй её как «якорь»: после неё запускай слабую привычку.`));
  if (longest && longest.s.best >= 7) out.push(card('bolt','Рекорд стрика', `«${esc(longest.h.name)}» — ${longest.s.best} дней подряд. Текущий: ${longest.s.cur}. Цель — превзойти рекорд.`));
  if (cat[0] && cat.length > 1) out.push(card('sliders','Баланс сфер', `Сильнее всего ${cat[0].c.name.toLowerCase()} (${Math.round(cat[0].r*100)}%), слабее — ${cat[cat.length-1].c.name.toLowerCase()} (${Math.round(cat[cat.length-1].r*100)}%).`));
  if (unusedCat) out.push(card('palette','Слепая зона', `Категория «${unusedCat.name}» не задействована. Одна привычка там добавит жизни баланса.`));
  const perfectRun = (() => { let best=0, run=0; perDay.forEach(d => { if (d.rate === 1){ run++; best=Math.max(best,run);} else run=0; }); return best; })();
  if (perfectRun >= 2) out.push(card('spark','Серия идеальных дней', `${perfectRun} дней со 100% выполнением подряд. Это твой эталон — держи его в голове в тяжёлые дни.`));
  return out.join('') || card('spark','Пока пусто','Отметь несколько дней — инсайты появятся автоматически.');
}

/* ---------- canvas helpers ---------- */
function setupCanvas(cv, h){
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = cv.parentElement.clientWidth - 32;
  cv.style.width = '100%'; cv.style.height = h + 'px';
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  return { ctx, w, h };
}
function animate(dur, fn){
  const t0 = performance.now();
  const step = now => { const p = clamp((now - t0)/dur, 0, 1); fn(1 - Math.pow(1-p, 3)); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function drawTrend(cv, perDay){
  if (!cv) return;
  const { ctx, w, h } = setupCanvas(cv, 230);
  const data = perDay.map(d => d.rate === null ? null : d.rate);
  const padL = 34, padB = 24, padT = 12, padR = 8;
  const iw = w - padL - padR, ih = h - padT - padB;
  const acc = getCSS('--acc'), acc2 = getCSS('--acc2'), stroke = getCSS('--stroke'), faint = getCSS('--faint');
  animate(900, p => {
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.font = '10px system-ui'; ctx.fillStyle = faint;
    for (let i = 0; i <= 4; i++){
      const y = padT + ih * i/4;
      ctx.globalAlpha = .8; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillText((100 - i*25) + '%', 4, y + 3.5);
    }
    const n = data.length; if (!n) return;
    const X = i => padL + (n === 1 ? iw/2 : iw * i/(n-1));
    const Y = v => padT + ih * (1 - v);
    // area
    const grad = ctx.createLinearGradient(0, padT, 0, h - padB);
    grad.addColorStop(0, acc + 'aa'); grad.addColorStop(1, acc + '00');
    ctx.beginPath();
    let started = false;
    data.forEach((v, i) => { if (v === null) return; const y = Y(v*p + (1-p)*0); if (!started){ ctx.moveTo(X(i), y); started = true; } else ctx.lineTo(X(i), y); });
    const lastIdx = data.reduce((a, v, i) => v !== null ? i : a, 0);
    const firstIdx = data.findIndex(v => v !== null);
    if (started){ ctx.lineTo(X(lastIdx), h - padB); ctx.lineTo(X(Math.max(0,firstIdx)), h - padB); ctx.closePath(); ctx.fillStyle = grad; ctx.fill(); }
    // line
    ctx.beginPath(); started = false;
    data.forEach((v, i) => { if (v === null) return; const y = Y(v*p); if (!started){ ctx.moveTo(X(i), y); started = true; } else ctx.lineTo(X(i), y); });
    ctx.strokeStyle = acc; ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.shadowColor = acc; ctx.shadowBlur = 12; ctx.stroke(); ctx.shadowBlur = 0;
    // moving average
    const ma = data.map((_, i) => { const s = data.slice(Math.max(0, i-6), i+1).filter(v => v !== null); return s.length ? avg(s) : null; });
    ctx.beginPath(); started = false;
    ma.forEach((v, i) => { if (v === null) return; const y = Y(v*p); if (!started){ ctx.moveTo(X(i), y); started = true; } else ctx.lineTo(X(i), y); });
    ctx.strokeStyle = acc2; ctx.lineWidth = 1.8; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
    // dots
    data.forEach((v, i) => { if (v === null) return; if (n > 60 && i % Math.ceil(n/60)) return;
      ctx.beginPath(); ctx.arc(X(i), Y(v*p), v === 1 ? 3.4 : 2.2, 0, 6.284); ctx.fillStyle = v === 1 ? getCSS('--ok') : acc; ctx.fill(); });
    // x labels
    ctx.fillStyle = faint; ctx.textAlign = 'center';
    const stepX = Math.max(1, Math.floor(n/7));
    for (let i = 0; i < n; i += stepX){ const d = D.parse(perDay[i].k); ctx.fillText(`${d.getDate()}.${pad(d.getMonth()+1)}`, X(i), h - 7); }
    ctx.textAlign = 'left';
  });
}
function drawDonut(cv, vals, legendEl){
  if (!cv) return;
  const { ctx, w, h } = setupCanvas(cv, 230);
  const total = vals.done + vals.skipped + vals.missed;
  const cols = [getCSS('--ok'), getCSS('--warn'), getCSS('--bad')];
  const labels = ['Выполнено','Пропущено осознанно','Провалено'];
  const data = [vals.done, vals.skipped, vals.missed];
  const cx = w/2, cy = h/2 - 4, R = Math.min(w, h)/2 - 22, r = R * .62;
  animate(850, p => {
    ctx.clearRect(0,0,w,h);
    if (!total){
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.284); ctx.arc(cx, cy, r, 0, 6.284, true);
      ctx.fillStyle = getCSS('--stroke'); ctx.fill();
      ctx.fillStyle = getCSS('--faint'); ctx.font = '600 13px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('нет данных', cx, cy + 4); ctx.textAlign = 'left';
    } else {
      let a0 = -Math.PI/2;
      data.forEach((v, i) => {
        if (!v) return;
        const a1 = a0 + (v/total) * 6.2832 * p;
        ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.arc(cx, cy, r, a1, a0, true); ctx.closePath();
        ctx.fillStyle = cols[i]; ctx.shadowColor = cols[i]; ctx.shadowBlur = 16; ctx.fill(); ctx.shadowBlur = 0;
        a0 = a1;
      });
      ctx.fillStyle = getCSS('--text'); ctx.font = '800 26px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(Math.round(vals.done/Math.max(1,total)*100) + '%', cx, cy + 2);
      ctx.font = '600 11px system-ui'; ctx.fillStyle = getCSS('--muted');
      ctx.fillText('успех', cx, cy + 18); ctx.textAlign = 'left';
    }
  });
  if (legendEl) legendEl.innerHTML = data.map((v,i) => `<span><i style="background:${cols[i]}"></i>${labels[i]}: <b>${v}</b></span>`).join('');
}
function drawDow(cv, habits, keys){
  if (!cv) return;
  const { ctx, w, h } = setupCanvas(cv, 220);
  const stats = [0,1,2,3,4,5,6].map(i => {
    const ks = keys.filter(k => D.dow(k) === i);
    let due = 0, done = 0;
    ks.forEach(k => habits.forEach(hh => { if (dueOn(hh, k)){ due++; if (isDone(hh.id, k)) done++; } }));
    return { i, due, done };
  });
  const max = Math.max(1, ...stats.map(s => s.due));
  const padL = 30, padB = 26, padT = 12; const iw = w - padL - 10, ih = h - padT - padB;
  const bw = iw/7 * .58;
  animate(800, p => {
    ctx.clearRect(0,0,w,h);
    ctx.font = '10px system-ui'; ctx.fillStyle = getCSS('--faint');
    for (let i = 0; i <= 4; i++){ const y = padT + ih*i/4; ctx.strokeStyle = getCSS('--stroke'); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-10,y); ctx.stroke();
      ctx.fillText(Math.round(max*(1-i/4)), 4, y+3.5); }
    stats.forEach((s, i) => {
      const x = padL + iw*(i+.5)/7 - bw/2;
      const hDue = ih * (s.due/max) * p, hDone = ih * (s.done/max) * p;
      ctx.fillStyle = getCSS('--stroke2');
      roundRect(ctx, x, padT + ih - hDue, bw, hDue, 6); ctx.fill();
      const g = ctx.createLinearGradient(0, padT, 0, h); g.addColorStop(0, getCSS('--ok')); g.addColorStop(1, getCSS('--acc2'));
      ctx.fillStyle = g; roundRect(ctx, x, padT + ih - hDone, bw, hDone, 6); ctx.fill();
      ctx.fillStyle = D.dow(D.today()) === i ? getCSS('--acc') : getCSS('--faint');
      ctx.font = (D.dow(D.today()) === i ? '800 ' : '600 ') + '11px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(WD[i], x + bw/2, h - 9);
      if (s.due){ ctx.fillStyle = getCSS('--muted'); ctx.font = '700 10px system-ui'; ctx.fillText(Math.round(s.done/Math.max(1,s.due)*100)+'%', x+bw/2, padT + ih - hDue - 6); }
      ctx.textAlign = 'left';
    });
  });
}
function drawRadar(cv, habits, N){
  if (!cv) return;
  const { ctx, w, h } = setupCanvas(cv, 260);
  const cats = CATEGORIES.map(c => {
    const hs = habits.filter(x => x.cat === c.id);
    const rs = hs.map(x => rateOf(x, N)).filter(v => v !== null);
    return { c, n: hs.length, v: rs.length ? avg(rs) : 0 };
  });
  const cx = w/2, cy = h/2 + 4, R = Math.min(w, h)/2 - 46;
  animate(900, p => {
    ctx.clearRect(0,0,w,h);
    const n = cats.length;
    for (let ring = 1; ring <= 4; ring++){
      ctx.beginPath();
      for (let i = 0; i <= n; i++){ const a = -Math.PI/2 + i/n*6.2832; const rr = R*ring/4;
        const x = cx + Math.cos(a)*rr, y = cy + Math.sin(a)*rr; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
      ctx.closePath(); ctx.strokeStyle = getCSS('--stroke'); ctx.stroke();
    }
    for (let i = 0; i < n; i++){ const a = -Math.PI/2 + i/n*6.2832;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); ctx.strokeStyle = getCSS('--stroke'); ctx.stroke(); }
    ctx.beginPath();
    cats.forEach((c, i) => { const a = -Math.PI/2 + i/n*6.2832; const rr = R*Math.max(.04, c.v)*p;
      const x = cx+Math.cos(a)*rr, y = cy+Math.sin(a)*rr; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
    ctx.closePath();
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
    g.addColorStop(0, getCSS('--acc') + 'cc'); g.addColorStop(1, getCSS('--acc2') + '44');
    ctx.fillStyle = g; ctx.shadowColor = getCSS('--acc'); ctx.shadowBlur = 18; ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = getCSS('--acc'); ctx.lineWidth = 2; ctx.stroke();
    cats.forEach((c, i) => { const a = -Math.PI/2 + i/n*6.2832;
      const x = cx+Math.cos(a)*(R+22), y = cy+Math.sin(a)*(R+22);
      ctx.textAlign = Math.cos(a) > .3 ? 'left' : Math.cos(a) < -.3 ? 'right' : 'center';
      ctx.font = '700 11px system-ui'; ctx.fillStyle = c.n ? getCSS('--text') : getCSS('--faint');
      ctx.fillText(c.c.em + ' ' + c.c.name, x, y);
      ctx.font = '600 10px system-ui'; ctx.fillStyle = getCSS('--muted');
      ctx.fillText(c.n ? Math.round(c.v*100)+'% · ' + c.n : '—', x, y + 12);
      const px = cx+Math.cos(a)*R*Math.max(.04,c.v)*p, py = cy+Math.sin(a)*R*Math.max(.04,c.v)*p;
      ctx.beginPath(); ctx.arc(px, py, 3.2, 0, 6.284); ctx.fillStyle = c.c.color; ctx.fill();
    });
    ctx.textAlign = 'left';
  });
}
function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2); if (h <= 0){ h = 0.01; }
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

function shareText(kind, data){
  const p = S.profile;
  if (kind === 'habit'){
    const h = data.habit, st = streakOf(h);
    const r30 = rateOf(h, 30);
    return `${h.emoji} ${h.name}\n🔥 ${st.cur}${st.weekly ? ' недель' : ' дней'} подряд (рекорд ${st.best})\n📈 ${r30 === null ? '—' : Math.round(r30*100) + '%'} за 30 дней\n— ${p.name || 'HabitVerse'}`;
  }
  const t = D.today();
  const keys = D.daysBetween(D.add(t, -6), t);
  const act = visibleHabits();
  let due = 0, done = 0;
  keys.forEach(k => act.forEach(h => { if (dueOn(h, k)){ due++; if (isDone(h.id, k)) done++; } }));
  const best = Math.max(0, ...act.map(h => streakOf(h).cur));
  return `📊 Моя неделя в HabitVerse\n✅ ${done} из ${due} отметок (${due ? Math.round(done/due*100) : 0}%)\n🔥 лучший стрик: ${best}\n⚡ уровень ${levelOf(p.xp).level} · ${p.xp} XP\n— ${p.name || ''}`;
}

function drawShareCard(canvas, kind, data){
  const W = 1080, H = 1080, k = 1;
  canvas.width = W * k; canvas.height = H * k;
  const c = canvas.getContext('2d');
  const cs = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const acc = cs('--acc') || '#6B6E76', acc2 = cs('--acc2') || '#3F8A80', acc3 = cs('--acc3') || '#A85C74';
  const solid = cs('--card-solid') || '#12142a', text = cs('--text') || '#eef0ff', muted = cs('--muted') || '#9aa0c3';
  const p = S.profile;

  // фон
  const bg = c.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, solid); bg.addColorStop(1, '#07080f');
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  // световые пятна
  const glow = (x, y, r, col, a) => { const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, col); g.addColorStop(1, 'transparent'); c.globalAlpha = a; c.fillStyle = g; c.fillRect(0, 0, W, H); c.globalAlpha = 1; };
  glow(W * .85, H * .1, 460, acc, .34);
  glow(W * .1, H * .95, 420, acc3, .22);
  glow(W * .5, H * .5, 380, acc2, .10);

  // рамка
  c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 3;
  c.beginPath(); c.roundRect ? c.roundRect(28, 28, W - 56, H - 56, 44) : c.rect(28, 28, W - 56, H - 56); c.stroke();

  const cx = W / 2;
  c.textAlign = 'center';

  if (kind === 'habit'){
    const h = data.habit, st = streakOf(h), r30 = rateOf(h, 30);
    c.font = '150px serif'; c.fillText(h.emoji, cx, 265);
    c.fillStyle = text; c.font = '800 54px system-ui, sans-serif';
    const nm = h.name.length > 26 ? h.name.slice(0, 25) + '…' : h.name;
    c.fillText(nm, cx, 355);
    c.fillStyle = muted; c.font = '600 26px system-ui, sans-serif';
    c.fillText(st.weekly ? 'НЕДЕЛЬ ПОДРЯД' : 'ДНЕЙ ПОДРЯД', cx, 405);
    c.fillStyle = h.color || acc; c.font = '900 210px system-ui, sans-serif';
    c.shadowColor = h.color || acc; c.shadowBlur = 60;
    c.fillText(String(st.cur), cx, 610);
    c.shadowBlur = 0;
    // три плашки
    const cells = [['рекорд', st.best], ['30 дней', r30 === null ? '—' : Math.round(r30 * 100) + '%'], ['уровень', levelOf(p.xp).level]];
    cells.forEach((cell, i) => {
      const w = 250, x = cx - (cells.length * w + (cells.length - 1) * 22) / 2 + i * (w + 22);
      c.fillStyle = 'rgba(255,255,255,.06)';
      c.beginPath(); c.roundRect ? c.roundRect(x, 680, w, 130, 26) : c.rect(x, 680, w, 130); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 2; c.stroke();
      c.fillStyle = text; c.font = '800 48px system-ui, sans-serif'; c.fillText(String(cell[1]), x + w / 2, 748);
      c.fillStyle = muted; c.font = '600 20px system-ui, sans-serif'; c.fillText(String(cell[0]).toUpperCase(), x + w / 2, 784);
    });
    // полоса последних 14 дней
    const t = D.today();
    for (let i = 13; i >= 0; i--){
      const key = D.add(t, -i);
      const okk = isDone(h.id, key), planned = dueOn(h, key);
      const bw = 46, x = cx - (14 * bw + 13 * 8) / 2 + (13 - i) * (bw + 8);
      c.fillStyle = okk ? (h.color || acc) : planned ? 'rgba(255,90,110,.55)' : 'rgba(255,255,255,.08)';
      c.beginPath(); c.roundRect ? c.roundRect(x, 850, bw, 46, 12) : c.rect(x, 850, bw, 46); c.fill();
    }
  } else {
    const t = D.today();
    const keys = D.daysBetween(D.add(t, -6), t);
    const act = visibleHabits();
    let due = 0, done = 0; const perDay = [];
    keys.forEach(kk => { let d = 0, n = 0; act.forEach(h => { if (dueOn(h, kk)){ d++; if (isDone(h.id, kk)) n++; } }); due += d; done += n; perDay.push({ k: kk, d, n }); });
    c.fillStyle = text; c.font = '800 60px system-ui, sans-serif'; c.fillText('МОЯ НЕДЕЛЯ', cx, 210);
    c.fillStyle = muted; c.font = '600 26px system-ui, sans-serif';
    c.fillText(D.human(keys[0]).toUpperCase() + ' — ' + D.human(keys[keys.length - 1]).toUpperCase(), cx, 258);
    c.fillStyle = acc2; c.font = '900 200px system-ui, sans-serif';
    c.shadowColor = acc2; c.shadowBlur = 60;
    c.fillText((due ? Math.round(done / due * 100) : 0) + '%', cx, 480);
    c.shadowBlur = 0;
    c.fillStyle = muted; c.font = '600 26px system-ui, sans-serif';
    c.fillText(`${done} ИЗ ${due} ОТМЕТОК`, cx, 528);
    const best = Math.max(0, ...act.map(h => streakOf(h).cur));
    const cells = [['лучший стрик', best + '🔥'], ['привычек', act.length], ['уровень', levelOf(p.xp).level]];
    cells.forEach((cell, i) => {
      const w = 250, x = cx - (cells.length * w + (cells.length - 1) * 22) / 2 + i * (w + 22);
      c.fillStyle = 'rgba(255,255,255,.06)';
      c.beginPath(); c.roundRect ? c.roundRect(x, 600, w, 130, 26) : c.rect(x, 600, w, 130); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 2; c.stroke();
      c.fillStyle = text; c.font = '800 46px system-ui, sans-serif'; c.fillText(String(cell[1]), x + w / 2, 668);
      c.fillStyle = muted; c.font = '600 19px system-ui, sans-serif'; c.fillText(String(cell[0]).toUpperCase(), x + w / 2, 702);
    });
    perDay.forEach((d, i) => {
      const bw = 108, x = cx - (7 * bw + 6 * 14) / 2 + i * (bw + 14);
      const rate = d.d ? d.n / d.d : 0;
      c.fillStyle = 'rgba(255,255,255,.07)';
      c.beginPath(); c.roundRect ? c.roundRect(x, 780, bw, 120, 18) : c.rect(x, 780, bw, 120); c.fill();
      c.fillStyle = rate >= 1 ? acc2 : rate > 0 ? acc : 'rgba(255,90,110,.5)';
      const hh = Math.max(6, 112 * rate);
      c.beginPath(); c.roundRect ? c.roundRect(x + 8, 780 + 120 - hh - 4, bw - 16, hh, 12) : c.rect(x + 8, 780 + 120 - hh - 4, bw - 16, hh); c.fill();
      c.fillStyle = muted; c.font = '700 20px system-ui, sans-serif';
      c.fillText(WD[D.dow(d.k)], x + bw / 2, 934);
    });
  }

  // подпись
  c.fillStyle = muted; c.font = '600 24px system-ui, sans-serif';
  c.fillText(`◈ HabitVerse · ${p.name || 'Пилот'} · ${D.today()}`, cx, 1000);
  c.textAlign = 'left';
}

const NOTE_COLORS = ['', '#6B6E7614', '#3F8A8014', '#A85C7414', '#A9853F14', '#4A76A814', '#5F8A6B14'];
/* ============================================================
   ЗАМЕТКИ v2: блочная типографика + сетка карточек
   ============================================================ */
function md2(src){
  const lines = String(src || '').split('\n');
  const out = [];
  let list = null;
  const inline = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[\[(\d{4}-\d{2}-\d{2})\]\]/g, '<span class="tag date">$1</span>');
  const flush = () => { if (list){ out.push(`<ul>${list.map(x => `<li>${inline(x)}</li>`).join('')}</ul>`); list = null; } };
  for (const raw of lines){
    const line = raw.trimEnd();
    if (/^\s*[-•] /.test(line)){ (list = list || []).push(line.replace(/^\s*[-•] /, '')); continue; }
    flush();
    if (!line.trim()) continue;
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h){ const lv = h[1].length + 2; out.push(`<h${lv}>${inline(h[2])}</h${lv}>`); continue; }
    if (/^>\s?/.test(line)){ out.push(`<blockquote>${inline(line.replace(/^>\s?/, ''))}</blockquote>`); continue; }
    out.push(`<p>${inline(line)}</p>`);
  }
  flush();
  return out.join('');
}

function mdLite(s){
  return esc(s || '')
    .replace(/^### (.*)$/gm, '<b style="font-size:14px;display:block;margin:6px 0 3px">$1</b>')
    .replace(/^## (.*)$/gm, '<b style="font-size:15px;display:block;margin:8px 0 4px">$1</b>')
    .replace(/^# (.*)$/gm, '<b style="font-size:16px;display:block;margin:9px 0 5px">$1</b>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\*(.+?)\*/g, '<i>$1</i>')
    .replace(/`(.+?)`/g, '<code style="background:var(--stroke);padding:1px 5px;border-radius:5px;font-size:.92em">$1</code>')
    .replace(/^- (.*)$/gm, '<div style="padding-left:10px">• $1</div>')
    .replace(/\[\[(\d{4}-\d{2}-\d{2})\]\]/g, '<span class="pill">$1</span>')
    .replace(/\n/g, '<br>');
}

function renderTeam(){
  const box = $('.page[data-page="team"]');
  const me = { id: 'me', name: S.profile.name || 'Вы', avatar_url: S.profile.avatar };
  const today = D.today();
  const active = S.challenges.filter(c => c.status === 'active');
  const finished = S.challenges.filter(c => c.status !== 'active');
  const accepted = S.friends.filter(f => (f.relation || 'accepted') === 'accepted');
  const incoming = S.friends.filter(f => f.relation === 'incoming' || f.relation === 'pending_in');

  const myScore = c => {
    const h = S.habits.find(x => x.id === c.habitId);
    if (!h) return { pct: 0, done: 0, days: 0 };
    const keys = D.daysBetween(c.start, c.end < today ? c.end : today);
    const due = keys.filter(k => dueOn(h, k));
    const done = due.filter(k => isDone(h.id, k)).length;
    return { pct: due.length ? Math.round(done / due.length * 100) : 0, done, days: due.length };
  };

  const chalCard = (c, i) => {
    const ms = myScore(c);
    const parts = (c.participants || []);
    const scores = parts.map(p => ({ ...p, score: p.id === 'me' ? ms.pct : Number(p.score) || 0 })).sort((x, y) => y.score - x.score);
    const myPos = scores.findIndex(x => x.id === 'me') + 1;
    const left = D.diff(today, c.end);
    const winner = left <= 0 ? scores[0] : null;
    return `<article class="chal-card" data-chal="${c.id}" style="animation-delay:${i * 30}ms">
      <header>
        <span class="cc-em" style="color:${c.color};background:color-mix(in oklab, ${c.color} 12%, var(--surface));border-color:color-mix(in oklab, ${c.color} 26%, var(--border))">${esc(c.emoji)}</span>
        <div class="cc-t">
          <h3>${esc(c.name)}</h3>
          ${c.desc ? `<p>${esc(c.desc)}</p>` : ''}
        </div>
        <button class="cc-menu" data-cmenu="${c.id}" title="Действия">${icon('dots', 15)}</button>
      </header>
      <div class="cc-tags">
        <span class="tag ${left > 0 ? (left <= 3 ? 'warn' : 'ok') : ''}">${left > 0 ? `осталось ${left} дн.` : 'завершён'}</span>
        <span class="tag">${D.human(c.start)} → ${D.human(c.end)}</span>
        <span class="tag">${parts.length} ${parts.length === 1 ? 'участник' : parts.length < 5 ? 'участника' : 'участников'}</span>
        <span class="tag" data-copycode="${c.id}" title="Скопировать код приглашения">${icon('link', 11)} ${esc(c.invite_code || c.code || '')}</span>
        ${myPos ? `<span class="tag ${myPos === 1 ? 'ok' : ''}">место ${myPos}</span>` : ''}
      </div>
      <div class="cc-prog">
        <div class="progress"><i style="width:${ms.pct}%;background:${c.color}"></i></div>
        <span class="num">${ms.pct}%</span>
      </div>
      <footer>
        <div class="avstack">${parts.slice(0, 5).map(p => avatarHtml({ name: p.name, avatar_url: p.avatar }, 24)).join('')}</div>
        <span class="cc-me">мой прогресс: <b class="num">${ms.done}/${ms.days}</b> дней</span>
      </footer>
      ${winner ? `<div class="cc-win">${icon('award', 14)} Победитель: <b>${esc(winner.name)}</b> — ${Math.round(winner.score)}%</div>` : ''}
    </article>`;
  };

  // лидерборд по отметкам за 30 дней
  const keys30 = D.daysBetween(D.add(today, -29), today);
  const myMarks = keys30.reduce((n, k) => n + visibleHabits().filter(h => isDone(h.id, k)).length, 0);
  const board = [
    { id: 'me', name: me.name, avatar_url: me.avatar_url, score: myMarks, me: true, streak: Math.max(0, ...visibleHabits().map(h => streakOf(h).cur), 0) },
    ...accepted.map(f => ({ id: f.id, name: f.display_name || f.name, avatar_url: f.avatar_url || f.avatar, score: Math.round((f.xp ?? 0) * 0.3) || 12 + (f.id.charCodeAt(2) % 40), streak: f.streak || 0 })),
  ].sort((a, b) => b.score - a.score);

  box.innerHTML = `
    ${incoming.length ? `<div class="banner">
      ${icon('users', 16)}
      <div><b>Заявки в друзья: ${incoming.length}</b><span>${incoming.map(f => esc(f.display_name || f.name)).join(', ')}</span></div>
      <div class="sp"></div>
      <button class="btn btn-sm" id="tmReq">Разобрать</button>
    </div>` : ''}

    <div class="sec-h">
      <h2>Активные челленджи</h2><span class="tag">${active.length}</span>
      <div class="sp"></div>
      <button class="btn btn-sm" id="tmJoin">${icon('link', 13)} Ввести код</button>
      <button class="btn btn-sm btn-primary" id="tmNew">${icon('plus', 13)} Челлендж</button>
    </div>
    ${active.length ? `<div class="chal-grid">${active.map(chalCard).join('')}</div>`
      : `<div class="empty card-flat"><span class="em">${icon('flag', 30)}</span><h3>Челленджей пока нет</h3>
         <p>Челлендж — это привычка, срок и команда. Создайте свой или вступите по коду приглашения.</p>
         <div style="display:flex;gap:8px;justify-content:center"><button class="btn" onclick="joinByCode()">Ввести код</button>
         <button class="btn btn-primary" onclick="challengeModal()">Создать</button></div></div>`}

    ${finished.length ? `<div class="sec-h" style="margin-top:26px"><h2>Завершённые</h2><span class="tag">${finished.length}</span></div>
      <div class="chal-grid">${finished.map(chalCard).join('')}</div>` : ''}

    <div class="grid g2" style="margin-top:26px;align-items:start">
      <div class="card">
        <div class="card-h"><h3>Лидерборд</h3><div class="sp"></div><span class="label">отметок за 30 дней</span></div>
        ${board.length ? board.map((r, i) => `
          <div class="lb-row ${r.me ? 'me' : ''}">
            <span class="lb-pos num">${i + 1}</span>
            ${avatarHtml(r, 30)}
            <div class="lb-t"><b>${esc(r.name)}${r.me ? ' <span class="tag">вы</span>' : ''}</b>
              <span>стрик ${r.streak}</span></div>
            <span class="lb-score num">${r.score}</span>
          </div>`).join('') : '<p class="hint">Добавьте друзей, чтобы увидеть сравнение.</p>'}
      </div>

      <div class="card">
        <div class="card-h"><h3>Экипаж</h3><div class="sp"></div>
          <button class="btn btn-sm" id="tmFind">${icon('search', 13)} Найти</button>
          <button class="btn btn-sm" id="tmNudgeAll" title="Отправить поддержку всем">${icon('send', 13)}</button>
        </div>
        ${accepted.length ? accepted.map(f => `
          <div class="crew-row" data-crew="${f.id}">
            ${avatarHtml(f, 30)}
            <div class="lb-t"><b>${esc(f.display_name || f.name)}</b><span>${esc(f.bio || 'в команде')}</span></div>
            <span class="tag">${icon('trend', 11)} ${f.streak || 0}</span>
            <div class="crew-acts">
              <button data-nudge="${f.id}" title="Поддержать">${icon('send', 13)}</button>
              <button data-fdel="${f.id}" title="Убрать из друзей">${icon('x', 13)}</button>
            </div>
          </div>`).join('') : `<div class="empty card-flat" style="padding:28px 16px"><span class="em">${icon('users', 26)}</span>
            <h3>Пока один</h3><p>Найдите друзей по имени — вместе держать стрик проще.</p>
            <button class="btn btn-primary btn-sm" onclick="friendsSheet()">Найти друзей</button></div>`}
      </div>
    </div>

    <div class="sec-h" style="margin-top:26px"><h2>Лента</h2><div class="sp"></div>
      <button class="btn btn-sm" id="tmSim" title="Симулировать активность команды">${icon('spark', 13)} Обновить</button>
    </div>
    <div class="card feed-card" id="teamFeed"></div>`;

  // лента внутри команды
  renderFeedList($('#teamFeed', box));

  $('#tmNew', box).onclick = () => challengeModal();
  $('#tmJoin', box).onclick = () => joinByCode();
  $('#tmFind', box).onclick = () => friendsSheet();
  const req = $('#tmReq', box);
  if (req) req.onclick = () => openMenuAt(req, S.friends.filter(f => f.relation === 'incoming').flatMap(f => [
    [`Принять: ${f.display_name}`, 'check', async () => { await respondFriendship ? 0 : 0; }],
  ]).length ? undefined : undefined) || friendsSheet();
  $('#tmNudgeAll', box).onclick = () => { accepted.forEach(f => addFeed('nudge', { friend: f.id, me: true })); toast(accepted.length ? 'Поддержка отправлена команде' : 'Сначала добавьте друзей', 'ok'); render(); };
  $('#tmSim', box).onclick = () => { simFriendActivity(); render(); };
  $$('[data-nudge]', box).forEach(b => b.onclick = () => { const f = S.friends.find(x => x.id === b.dataset.nudge); addFeed('nudge', { friend: f.id, me: true }); toast(`${f.display_name || f.name}: поддержка отправлена`, 'ok'); render(); });
  $$('[data-fdel]', box).forEach(b => b.onclick = () => confirmDialog('Убрать из друзей?', 'Вы перестанете видеть отметки друг друга.', () => { S.friends = S.friends.filter(f => f.id !== b.dataset.fdel); save(); render(); }, 'Убрать'));
  $$('[data-copycode]', box).forEach(b => b.onclick = e => { e.stopPropagation(); const c = S.challenges.find(x => x.id === b.dataset.copycode); const code = c.invite_code || c.code || ''; navigator.clipboard?.writeText(code).then(() => toast('Код скопирован: ' + code, 'ok'), () => toast(code, 'info')); });
  $$('[data-chal]', box).forEach(card => {
    card.onclick = e => { if (e.target.closest('button')) return; challengeSheet(card.dataset.chal); };
  });
  $$('[data-cmenu]', box).forEach(b => b.onclick = e => {
    e.stopPropagation();
    const c = S.challenges.find(x => x.id === b.dataset.cmenu);
    openMenuAt(b, [
      ['Открыть', 'chevR', () => challengeSheet(c.id)],
      ['Скопировать код', 'copy', () => { navigator.clipboard?.writeText(c.invite_code || c.code || ''); toast('Код скопирован', 'ok'); }],
      'hr',
      ...(c.creator_id === 'me' || true ? [['Удалить', 'trash', () => confirmDialog('Удалить челлендж?', 'Прогресс участников будет потерян.', () => { S.challenges = S.challenges.filter(x => x.id !== c.id); save(); render(); }), true]] : []),
    ]);
  });
}

   ЛЕНТА v2 (внутри раздела «Команда»)

function renderFeedList(host){
  const items = S.feed.slice(0, 50);
  if (!items.length){
    host.innerHTML = `<div class="empty" style="padding:30px 16px"><span class="em">${icon('spark', 26)}</span>
      <h3>Лента пуста</h3><p>Отметьте привычку — здесь появится событие.</p></div>`;
    return;
  }
  host.innerHTML = items.map((f, i) => feedItem(f, i)).join('');
  $$('[data-react]', host).forEach(b => b.onclick = () => {
    const [fid, em] = b.dataset.react.split('|');
    b.classList.add('react-pop');
    reactTo(fid, em);
  });
}

function feedItem(f, i){
  const who = f.who === 'me'
    ? { id: 'me', name: S.profile.name || 'Вы', avatar_url: S.profile.avatar }
    : (() => { const fr = friendById(f.who); return { id: fr.id || f.who, name: fr.display_name || fr.name || 'Кто-то', avatar_url: fr.avatar_url || fr.avatar || null }; })();
  const isMe = f.who === 'me';
  const p = f.data || {};
  const habit = p.habitId ? S.habits.find(h => h.id === p.habitId) : null;
  const date = p.key ? D.human(p.key) : '';

  let txt = '';
  switch (f.type){
    case 'checkin': txt = habit ? `отмечает ${habit.emoji} <b>${esc(habit.name)}</b>${date && date !== 'сегодня' ? ` за ${esc(date)}` : ''}` : 'отмечает привычку'; break;
    case 'uncheck': txt = habit ? `снимает отметку: ${esc(habit.name)}` : 'снимает отметку'; break;
    case 'newhabit': txt = habit ? `создаёт привычку ${habit.emoji} <b>${esc(habit.name)}</b>` : 'создаёт привычку'; break;
    case 'delhabit': txt = 'архивирует привычку'; break;
    case 'streak': txt = p.days ? `держит стрик <b class="num">${p.days}</b> ${p.days === 1 ? 'день' : p.days < 5 ? 'дня' : 'дней'}` : 'обновляет стрик'; break;
    case 'perfect': txt = 'закрывает день полностью'; break;
    case 'level': txt = 'закрывает неделю по квоте'; break;
    case 'note': txt = 'добавляет заметку'; break;
    case 'challenge': txt = p.action === 'join' ? 'вступает в челлендж' : 'запускает челлендж'; break;
    case 'nudge': txt = isMe ? 'поддерживает команду' : 'шлёт вам поддержку'; break;
    case 'join': txt = 'присоединяется к команде'; break;
    default: txt = 'обновляет прогресс';
  }

  return `<div class="feed-item ${i === 0 ? 'new' : ''}">
    ${avatarHtml(who, 30)}
    <div class="fi-b">
      <div class="fi-t"><b>${esc(who.name)}</b> ${txt}</div>
      <div class="fi-time">${D.ago(f.ts)}</div>
      ${reactionsHTML(f.id)}
    </div>
  </div>`;
}

const REACTIONS = ['🔥','👏','💪','😮','❤️'];
function reactTo(feedId, emoji){
  if (!S.reactions[feedId]) S.reactions[feedId] = {};
  const r = S.reactions[feedId];
  const mine = r[emoji] && r[emoji].includes('me');
  if (mine) r[emoji] = r[emoji].filter(x => x !== 'me');
  else (r[emoji] = r[emoji] || []).push('me');
  if (!r[emoji].length) delete r[emoji];
  if (!Object.keys(r).length) delete S.reactions[feedId];
  save();
  sfx(mine ? 'uncheck' : 'click');
  render({ keepScroll: true });
}
function reactionsHTML(feedId){
  const r = S.reactions[feedId] || {};
  const chips = REACTIONS.map(e => {
    const who = r[e] || [];
    const names = who.map(x => x === 'me' ? 'вы' : (friendById(x).name || x)).join(', ');
    return `<button class="react ${who.includes('me') ? 'on' : ''}" data-react="${feedId}|${e}" title="${names ? names : 'поставить реакцию'}">
      ${e}${who.length ? ` <b>${who.length}</b>` : ''}</button>`;
  }).join('');
  return `<div class="reacts">${chips}</div>`;
}

    ${c.desc ? `<p class="small muted" style="line-height:1.6;margin-bottom:14px">${esc(c.desc)}</p>` : ''}
    <div class="card" style="margin-bottom:12px"><b class="small">🔑 Код приглашения</b>

let menuTrigger = null;
function closeMenu(){ $$('#menuHost .menu').forEach(x => x.remove()); menuTrigger = null; }

/* меню-поповер: items = [[label, icon, fn, danger?], …] или 'hr' */
function openMenuAt(anchor, items){
  closeMenu();
  menuTrigger = anchor;
  const m = document.createElement('div');
  m.className = 'menu';
  m.innerHTML = items.map(it => it === 'hr' ? '<hr>' :
    `<button class="${it[3] ? 'danger' : ''}">${icon(it[1] || 'dots', 14)}<span>${esc(it[0])}</span>${it[4] ? `<span class="k">${esc(it[4])}</span>` : ''}</button>`).join('');
  $('#menuHost').appendChild(m);
  const r = anchor.getBoundingClientRect();
  const mw = 216, mh = m.offsetHeight || 200;
  m.style.top = Math.min(window.innerHeight - mh - 8, r.bottom + 6) + 'px';
  m.style.left = Math.min(window.innerWidth - mw - 8, Math.max(8, r.right - mw)) + 'px';
  const acts = m.querySelectorAll('button');
  let i = 0;
  items.forEach(it => { if (it === 'hr') return; acts[i++].onclick = () => { closeMenu(); it[2](); }; });
  setTimeout(() => document.addEventListener('click', closeMenu, { once: true }), 0);
  return m;
}

function shrinkImage(dataUrl, size){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const k = Math.min(size / img.width, size / img.height, 1);
      c.width = Math.max(1, img.width * k); c.height = Math.max(1, img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .86));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

let notifFired = new Set();
function notifTick(){
  if (!S.profile.notif || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const now = new Date(); const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const t = D.today();
  // персональные напоминания привычек
  visibleHabits().forEach(h => {
    if (!h.reminder || !h.notif) return;
    if (h.repeatDays !== false && !dueOn(h, t)) return;
    const key = h.id + '|' + t + '|' + h.reminder;
    if (hm === h.reminder && !notifFired.has(key) && !isDone(h.id, t)){
      notifFired.add(key);
      new Notification(`${h.emoji} ${h.name}`, { body: h.desc || 'Пора отмечать — стрик ждёт 🔥', tag: h.id });
      sfx('click');
    }
  });
  // вечерняя сводка
  const sKey = 'summary|' + t;
  if (hm === (S.profile.notifTime || '20:00') && !notifFired.has(sKey)){
    const due = visibleHabits().filter(h => dueOn(h, t));
    const left = due.filter(h => !isDone(h.id, t));
    notifFired.add(sKey);
    if (left.length) new Notification('📋 Итоги дня', { body: left.length === due.length ? `Сегодня ничего не отмечено. Начни с одной привычки: ${left[0].emoji} ${left[0].name}` : `Осталось ${left.length} из ${due.length}: ${left.map(h => h.emoji).join(' ')}`, tag:'summary' });
    else if (due.length) new Notification('🏆 Идеальный день!', { body:'Все привычки выполнены. Так держать!', tag:'summary' });
  }
}
function testNotify(){
  if (!('Notification' in window)) return toast('Браузер не поддерживает уведомления','bad','🚫');
  Notification.requestPermission().then(p => {
    if (p !== 'granted') return toast(`Разрешение: ${p}. Включи уведомления в настройках сайта.`,'bad','🔕');
    const due = visibleHabits().filter(h => dueOn(h, D.today()) && !isDone(h.id, D.today()));
    new Notification('HabitVerse 🔔', { body: due.length ? `Осталось ${due.length} привычек на сегодня: ${due.map(h=>h.emoji).join(' ')}` : 'На сегодня всё выполнено — красавчик! 🏆' });
    toast('Тестовое уведомление отправлено','ok','🔔');
  });
}

/* ---------- export ---------- */
function download(name, text, mime){
  const b = new Blob([text], { type: mime }); const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function exportJson(){ download(`habitverse-${D.today()}.json`, JSON.stringify(S, null, 2), 'application/json'); toast('JSON экспортирован','ok','⬇'); }
function exportCsv(){
  const rows = [['date','habit','emoji','category','status','value','unit','note','streak']];
  Object.entries(S.logs).forEach(([hid, m]) => {
    const h = S.habits.find(x => x.id === hid); if (!h) return;
    Object.entries(m).forEach(([k, l]) => rows.push([k, h.name, h.emoji, catOf(h.cat).name, l.status, l.val ?? '', h.unit || '', (l.note||'').replace(/[\n;]/g,' '), '']));
  });
  rows.sort((a,b) => a[0] < b[0] ? 1 : -1);
  download(`habitverse-${D.today()}.csv`, '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'), 'text/csv');
  toast('CSV экспортирован','ok','📊');
}

/* ---------- 3D tilt ---------- */
function bindTilt(){
  $$('.tilt').forEach(el => {
    if (el._tilt) return; el._tilt = true;
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5;
      el.style.transform = `perspective(900px) rotateY(${x*9}deg) rotateX(${-y*9}deg) translateZ(6px)`;
    });
    el.addEventListener('pointerleave', () => { el.style.transform = ''; });
  });
}

      <div style="display:flex;gap:8px">
        <button class="btn" data-back style="flex:1">Назад</button>
        <button class="btn btn-primary" data-next style="flex:2">Дальше</button></div>
      ${dots(4)}</div>`,
    () => `<div class="onb-card">
      <span class="em">${esc(draft.emoji)}</span>
      <h2>Выберите аватар</h2>
      <p>Потом можно загрузить фото в настройках.</p>
      <div class="onb-emoji">${ONB_EMOJI.map(e => `<button data-av="${e}" class="${draft.emoji === e ? 'on' : ''}">${e}</button>`).join('')}</div>
      <div style="display:flex;gap:8px">
        <button class="btn" data-back style="flex:1">Назад</button>
        <button class="btn btn-primary" data-next style="flex:2">Дальше</button></div>
      ${dots(4)}</div>`,
    () => `<div class="onb-card">
      <span class="em">◈</span>
      <h2>Готово</h2>
      <p>Наполнить демо-данными (13 привычек, 90 дней истории, команда, челленджи и заметки) или начать с чистого листа?</p>
      <button class="btn btn-primary btn-lg" data-seed style="width:100%;margin-bottom:8px">Загрузить демо-данные</button>
      <button class="btn btn-lg" data-clean style="width:100%;margin-bottom:8px">С чистого листа</button>
      <button class="btn btn-quiet btn-sm" data-back style="width:100%">Назад</button>
      ${dots(4)}</div>`,
  ];

  const paint = () => {
    stage.innerHTML = steps[step]();
    const name = $('#onbName', stage);
    if (name){ name.focus(); name.oninput = e => draft.name = e.target.value; }
    $$('[data-av]', stage).forEach(b => b.onclick = () => { draft.emoji = b.dataset.av; paint(); });
    const next = $('[data-next]', stage);
    if (next) next.onclick = () => { if (name) draft.name = name.value; step = Math.min(3, step + 1); paint(); };
    const back = $('[data-back]', stage);
    if (back) back.onclick = () => { if (name) draft.name = name.value; step = Math.max(0, step - 1); paint(); };
    const seed = $('[data-seed]', stage); if (seed) seed.onclick = () => finish(true);

  const finish = withSeed => {

  paint();
}
